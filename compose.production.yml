services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${DB_NAME:?DB_NAME is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - db

  migrate:
    build:
      context: ./backend
    restart: "no"
    command:
      ["./node_modules/.bin/typeorm", "migration:run", "-d", "dist/data-source.js"]
    environment: &backend-environment
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/todo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app
      - db

  web:
    build:
      context: ./fronted
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - edge
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    profiles:
      - tunnel

volumes:
  mysql-data:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  db:
    driver: bridge
